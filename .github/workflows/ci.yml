name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo fmt --all --check
      - run: cargo nextest run --workspace --all-targets --locked
      - run: cargo test --workspace --doc --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --lib --target wasm32-unknown-unknown --locked
      - run: cargo run -p htn-planner-ron --example warehouse --locked
      - run: cargo run -p htn-planner-ron --example lifecycle --locked
      - run: python3 -B scripts/test-check-htn-packages.py
      - run: python3 -B scripts/check-htn-packages.py --offline --output target/package-qualification
